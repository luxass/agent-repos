name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs. Two of the upstreams publish
# annotated tags, whose tag-object SHA does not resolve in `uses:` — the SHAs
# below are the dereferenced commits.
env:
  CARGO_TERM_COLOR: always
  # The size guard: fails the build if a change quietly pulls in something
  # expensive.
  #
  # 640 KB is measured, not guessed. On x86_64-unknown-linux-musl — the largest
  # target — a hello-world using nothing but args, Command and fs already costs
  # ~426 KB with this exact profile, because std links the backtrace machinery
  # (gimli, addr2line, miniz_oxide, libunwind, rustc_demangle) whether or not
  # you ever panic. All of agent-repos adds roughly 137 KB on top of that.
  #
  # Getting below the std floor needs `-Z build-std` with
  # `panic_immediate_abort`, which is nightly-only and would break the pinned
  # stable toolchain. So this limit guards *our* growth: ~80 KB of headroom
  # over the current largest binary.
  MAX_BINARY_BYTES: 655360

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the compiler, and rustup honours it
      # automatically, so no third-party toolchain action is needed.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build release
        run: cargo build --release

      - name: Size guard
        run: |
          size=$(stat -c%s target/release/agent-repos)
          echo "agent-repos: ${size} bytes (limit ${MAX_BINARY_BYTES})"
          if [ "$size" -gt "$MAX_BINARY_BYTES" ]; then
            echo "::error::binary is ${size} bytes, over the ${MAX_BINARY_BYTES} byte limit"
            exit 1
          fi

  musl:
    name: Static musl build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # No musl-gcc, no Docker, no zig: the crate has no C dependencies, so
      # rustc's self-contained musl runtime and the bundled rust-lld suffice.
      - name: Build x86_64-unknown-linux-musl
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Build aarch64-unknown-linux-musl
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Verify both are statically linked
        run: |
          # x86_64 links as "static-pie linked", aarch64 as "statically
          # linked" — both are fully static, so accept either spelling.
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            bin="target/${target}/release/agent-repos"
            echo "== ${target} =="
            file "$bin"
            file "$bin" | grep -qE "static-pie linked|statically linked" || {
              echo "::error::${target} binary is not statically linked"
              exit 1
            }
          done

      - name: Size guard
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            bin="target/${target}/release/agent-repos"
            size=$(stat -c%s "$bin")
            echo "${target}: ${size} bytes (limit ${MAX_BINARY_BYTES})"
            if [ "$size" -gt "$MAX_BINARY_BYTES" ]; then
              echo "::error::${target} is ${size} bytes, over the ${MAX_BINARY_BYTES} byte limit"
              exit 1
            fi
          done
