# The musl targets ship a self-contained C runtime (prebuilt libc.a plus crt
# objects) and link with the rust-lld bundled in the toolchain. Because this
# crate has no C dependencies and no build script, that is enough to cross
# compile a fully static Linux binary from any host — no musl-gcc, no Docker,
# no zig.
[target.x86_64-unknown-linux-musl]
rustflags = ["-Clink-self-contained=yes", "-Clinker=rust-lld"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-Clink-self-contained=yes", "-Clinker=rust-lld"]
